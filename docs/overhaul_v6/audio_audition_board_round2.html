  :root { --bg:#0c1310; --panel:#131e19; --card:#192821; --border:#435749; --gold:#ebd494; --text:#e2e5d5; --muted:#98aa9d; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 18px 96px; background:radial-gradient(circle at top, #1a241d 0%, var(--bg) 65%); color:var(--text); font-family:"Microsoft YaHei","SimSun",sans-serif; line-height:1.55; }

  .cat-desc { margin:0 0 12px; color:var(--muted); font-size:13px; }
  .samples-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(430px, 1fr)); gap:12px; }
  .sample-card { display:flex; flex-direction:column; gap:8px; background:var(--card); border:1px solid #2c3d32; border-radius:5px; padding:12px 14px; cursor:pointer; }
  .sample-card:has(input:checked) { border-color:var(--gold); background:#203429; }
  .sample-top { display:flex; align-items:flex-start; gap:10px; }
  .sample-top input { margin-top:4px; transform:scale(1.2); accent-color:var(--gold); }
  .sample-title { font-weight:600; font-size:14px; color:#f2f1e4; }
  .sample-sub { font-size:11px; color:var(--muted); margin-top:2px; word-break:break-all; }
  audio { width:100%; height:34px; }
  .note-row { margin-top:10px; }
  .cat-note { width:100%; padding:8px 10px; border-radius:4px; border:1px solid #384a3e; background:#0f1713; color:var(--text); font-size:13px; }
  .sticky-bar { position:fixed; left:0; right:0; bottom:0; background:rgba(10,16,13,0.96); border-top:1px solid var(--gold); padding:12px 24px; display:flex; align-items:center; justify-content:center; gap:16px; z-index:99; }
  button.primary { background:#3d5c45; color:var(--gold); border:1px solid var(--gold); padding:10px 22px; font-size:14px; font-weight:600; border-radius:4px; cursor:pointer; }
  #copyStatus { font-size:13px; color:#a7e0b3; }
  pre#preview { background:#0b110e; border:1px solid var(--border); padding:14px; border-radius:4px; font-size:12px; color:#d6e4c9; white-space:pre-wrap; display:none; }

<script>
document.addEventListener('play', function(e) {
  document.querySelectorAll('audio').forEach(a => { if (a !== e.target) a.pause(); });
}, true);
function copyR2() {
  const lines = ['【《澳诡实录》V6 二轮音频审批结果】'];
  document.querySelectorAll('.cat-box').forEach(sec => {
    const title = sec.dataset.title;
    const checked = Array.from(sec.querySelectorAll('input:checked')).map(el => `${el.dataset.title} (${el.value})`);
    const note = sec.querySelector('.cat-note').value.trim();
    lines.push('');
    lines.push('■ ' + title);
    lines.push('  选中：' + (checked.length ? checked.join('；') : '（暂未勾选）'));
    if (note) lines.push('  备注：' + note);
  });
  const text = lines.join('\n');
  const pre = document.getElementById('preview');
  pre.textContent = text;
  pre.style.display = 'block';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      document.getElementById('status' in document ? 'status' : 'copyStatus').textContent = '已复制到剪贴板！请粘贴发回给我。';
    });
  }
}
</script>
